server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # sub_filter needs uncompressed upstream responses
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<title>RustFS</title>' '<title>JNV Spectra</title>';
        sub_filter '"children":"RustFS"' '"children":"JNV Spectra"';
        sub_filter '</head>' '<style>#jnv-brand{position:fixed;top:10px;right:14px;font:600 13px/1 system-ui,sans-serif;color:#1668dc;z-index:99999;letter-spacing:.5px}</style></head>';
        sub_filter '<body>' '<body><div id="jnv-brand">JNV Spectra</div>';
    }
}
