server {
    listen 80;
    server_name _;

    # Our logo: served at the console's own bundled-asset paths and the
    # rewritten theme-manifest path
    location = /rustfs/console/jnv-logo.svg {
        alias /usr/share/nginx/brand/jnv-logo.png;
        types { }
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /rustfs/console/_next/static/media/logo.2dxb038iosrjg.svg {
        alias /usr/share/nginx/brand/jnv-logo.png;
        types { }
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /rustfs/console/_next/static/media/logo-dark.2dxb038iosrjg.svg {
        alias /usr/share/nginx/brand/jnv-logo.png;
        types { }
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # sub_filter needs uncompressed upstream responses
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;

        # HTML shell: tab title + CSS-only brand badge (survives React hydration)
        sub_filter '<title>RustFS</title>' '<title>JNV Spectra</title>';
        sub_filter '"children":"RustFS"' '"children":"JNV Spectra"';
        sub_filter '</head>' '<style>body::before{content:"JNV Spectra";position:fixed;top:10px;right:14px;font:600 13px/1 system-ui,sans-serif;color:#1668dc;z-index:99999;letter-spacing:.5px}img[src*="logo.2dxb038iosrjg"],img[src*="logo-dark.2dxb038iosrjg"],img[src*="jnv-logo"]{height:96px !important;width:auto !important;max-width:none !important}</style></head>';

        # Runtime text rebranding for client-rendered content
        sub_filter '</body>' '<script>(function(){var M={"RustFS is a distributed file system written in Rust.":"Event & Venue Management Platform","Rust-based":"JNV Spectra","Reliable distributed file system":"Event & Venue Management","RustFS":"JNV Spectra"};function f(n){if(n.nodeType===3){var v=n.nodeValue;for(var k in M)if(v.indexOf(k)>-1)n.nodeValue=n.nodeValue.split(k).join(M[k]);}else if(n.nodeType===1){if(n.tagName==="A"&&/visit website/i.test(n.textContent||"")){n.remove();return;}for(var i=0;i<n.childNodes.length;i++)f(n.childNodes[i]);}}new MutationObserver(function(ms){ms.forEach(function(m){for(var i=0;i<m.addedNodes.length;i++)f(m.addedNodes[i]);});}).observe(document.body,{childList:true,subtree:true});f(document.body);})();</script></body>';

        # JS theme manifest: brand strings + logo asset URL
        sub_filter 'brand:{name:"RustFS",shortName:"RustFS",description:"RustFS is a distributed file system written in Rust."}' 'brand:{name:"JNV Spectra",shortName:"JNV",description:"Event & Venue Management Platform"}';
        sub_filter '??"RustFS"' '??"JNV Spectra"';
        sub_filter '/themes/default/assets/logo.svg' '/jnv-logo.svg';
        sub_filter '/themes/default/assets/logo-dark.svg' '/jnv-logo.svg';
        sub_filter 'www.rustfs.com' 'www.jnvspectra.com';
        sub_filter 'docs.rustfs.com' 'www.jnvspectra.com';
    }
}
